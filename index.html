    <title>exp-numbers-01</title>

<body>

            <div class="window" row="3" sector="tr" delay="2"></div>

            <div class="window" row="5" sector="br" delay="2"></div>
            <div class="window" row="5" sector="br" delay="1"></div>

            <div class="window" row="6" sector="bl" delay="0"></div>

            <div class="window" row="6" sector="bl" delay="2"></div>
